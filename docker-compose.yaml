name: jsn

services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Containerfile
    ports:
      - "80:80"
      - "443:443"
    restart: always
    volumes:
      - /etc/letsencrypt:/etc/nginx/ssl:ro
      - ./certbot/webroot:/var/certbot:ro
    depends_on:
      - main-site
      - headscale
    networks:
      - internal

  main-site:
    build:
      context: ./site
      dockerfile: Containerfile
    restart: always
    expose:
      - "80"
    networks:
      - internal

  red-and-black-knights:
    build:
      context: .
      dockerfile: projects/red-and-black-knights/Containerfile
    restart: always
    expose:
      - "80"
    networks:
      - internal

  software-renderer:
    build:
      context: .
      dockerfile: projects/software-renderer/Containerfile
    restart: always
    expose:
      - "80"
    networks:
      - internal

  scavenger:
    build:
      context: ./projects/scavenger
      dockerfile: Containerfile
    restart: always
    expose:
      - "80"
    networks:
      - internal

  this-wiki-dne:
    build:
      context: .
      dockerfile: projects/this-wiki-dne/Containerfile
    restart: always
    expose:
      - "80"
    networks:
      - internal

  name-a-woman:
    build:
      context: .
      dockerfile: projects/name-a-woman/Containerfile
    restart: always
    volumes:
      - name-a-woman-data:/app/data
    expose:
      - "8080"
    networks:
      - internal

  headscale:
    build:
      context: ./headscale
      dockerfile: Containerfile
      args:
        HEADSCALE_OIDC_CLIENT_ID: ${HEADSCALE_OIDC_CLIENT_ID}
        HEADSCALE_OIDC_CLIENT_SECRET: ${HEADSCALE_OIDC_CLIENT_SECRET}
        # HEADSCALE_OIDC_ALLOWED_USERS is generated from headscale/allowed_users.txt at build time
    restart: always
    read_only: true
    tmpfs:
      - /var/run/headscale
    volumes:
      - ./headscale/acl.hujson:/etc/headscale/acl.hujson:ro
      - headscale-data:/var/lib/headscale
    command: serve
    ports:
      - "3478:3478/udp"
    expose:
      - "8080"
    networks:
      - internal

  headscale-ui:
    image: ghcr.io/gurucomputing/headscale-ui:latest
    restart: always
    expose:
      - "8080"
    networks:
      - internal

networks:
  internal: {}

volumes:
  headscale-data: {}
  name-a-woman-data: {}
