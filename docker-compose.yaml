name: jsn

services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Containerfile
    ports:
      - "80:80"
      - "443:443"
    restart: always
    volumes:
      - /etc/letsencrypt:/etc/nginx/ssl:ro
      - ./certbot/webroot:/var/certbot:ro
    depends_on:
      - main-site
      - headscale
    networks:
      - internal

  main-site:
    build:
      context: ./site
      dockerfile: Containerfile
    restart: always
    expose:
      - "80"
    networks:
      - internal

  red-and-black-knights:
    build:
      context: .
      dockerfile: projects/red-and-black-knights/Containerfile
    restart: always
    expose:
      - "80"
    networks:
      - internal

  software-renderer:
    build:
      context: .
      dockerfile: projects/software-renderer/Containerfile
    restart: always
    expose:
      - "80"
    networks:
      - internal

  scavenger:
    build:
      context: ./projects/scavenger
      dockerfile: Containerfile
    restart: always
    expose:
      - "80"
    networks:
      - internal

  this-wiki-dne:
    build:
      context: .
      dockerfile: projects/this-wiki-dne/Containerfile
    restart: always
    expose:
      - "80"
    networks:
      - internal

  headscale:
    image: headscale/headscale:0.28.0
    restart: always
    read_only: true
    tmpfs:
      - /var/run/headscale
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - ./headscale/acl.hujson:/etc/headscale/acl.hujson:ro
      - headscale-data:/var/lib/headscale
    env_file:
      - .env
    command: serve
    ports:
      - "3478:3478/udp"
    expose:
      - "8080"
    networks:
      - internal

  headscale-ui:
    image: ghcr.io/gurucomputing/headscale-ui:latest
    restart: always
    expose:
      - "8080"
    networks:
      - internal

networks:
  internal: {}

volumes:
  headscale-data: {}
