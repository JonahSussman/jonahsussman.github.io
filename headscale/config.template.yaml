---
# Headscale configuration
# Secrets are injected via HEADSCALE_* environment variables (see .env.example)
# Docs: https://headscale.net/stable/ref/configuration/

# Public URL that Tailscale clients use to reach this coordination server
server_url: https://vpn.jonahsussman.net

# Internal listen address for the main HTTP service (proxied by nginx)
listen_addr: 0.0.0.0:8080

# Prometheus metrics endpoint (internal only, not exposed publicly)
metrics_listen_addr: 0.0.0.0:9090

# gRPC interface for the headscale CLI (e.g. `docker exec headscale headscale nodes list`)
# Bound to localhost since we only run CLI commands from inside the container
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

# WireGuard Noise protocol key - auto-generated on first run, persisted in the volume
noise:
  private_key_path: /var/lib/headscale/noise_private.key

# IP ranges assigned to devices on the Tailscale network
# 100.64.0.0/10 is IANA-reserved for Carrier-Grade NAT, won't collide with home LANs
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

# DERP (Designated Encrypted Relay for Packets) - fallback relay when direct
# NAT hole-punching between devices fails. We self-host the relay within
# Headscale itself instead of using Tailscale's public DERP servers.
# STUN (UDP 3478) helps devices discover their public IP for hole-punching.
derp:
  server:
    enabled: true
    region_id: 999          # arbitrary identifier for this DERP region
    region_code: "jsn"      # short label shown in `tailscale netcheck`
    region_name: "jonahsussman.net"
    private_key_path: /var/lib/headscale/derp_server_private.key
    stun_listen_addr: 0.0.0.0:3478
    automatically_add_embedded_derp_region: true
  urls: []                  # no external DERP maps (fully self-hosted)
  paths: []
  auto_update_enabled: false
  update_frequency: 3h

# SQLite database - stores registered nodes, users, keys, etc.
# Persisted in the headscale-data Docker volume
database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

# TLS is terminated by nginx, not Headscale
tls_cert_path: ""
tls_key_path: ""

# Nodes must re-authenticate after this period (set to 0 to disable expiry)
node:
  expiry: 180d
  ephemeral:
    inactivity_timeout: 30m  # remove ephemeral nodes after 30min of inactivity

# MagicDNS - gives devices friendly names like minecraft.wicker.lan
# base_domain must differ from server_url domain (headscale requirement)
# override_local_dns makes Headscale's DNS authoritative on connected devices
dns:
  magic_dns: true
  base_domain: wicker.lan
  override_local_dns: true
  nameservers:
    global:
      - 1.1.1.1              # Cloudflare DNS (fallback for non-MagicDNS queries)
      - 1.0.0.1

# ACL policy file - controls which users/devices can talk to each other
# Edit headscale/acl.hujson and restart to apply changes
policy:
  mode: file
  path: /etc/headscale/acl.hujson

# OIDC authentication via Google
# client_id and client_secret are injected via environment variables
# (HEADSCALE_OIDC_CLIENT_ID and HEADSCALE_OIDC_CLIENT_SECRET)
# so they don't appear in this file (repo is public)
oidc:
  only_start_if_oidc_is_available: true
  issuer: https://accounts.google.com
  client_id: "${HEADSCALE_OIDC_CLIENT_ID}"
  client_secret: "${HEADSCALE_OIDC_CLIENT_SECRET}"
  allowed_users: ${HEADSCALE_OIDC_ALLOWED_USERS}
  scope:
    - openid
    - profile
    - email
  extra_params:
    prompt: select_account   # always show Google account picker
  pkce:
    enabled: true            # proof key for code exchange (prevents auth code interception)
    method: S256

log:
  level: info
  format: text

# Disable telemetry and update checks
logtail:
  enabled: false
disable_check_updates: true

# Unix socket for local IPC (used internally by the headscale process)
unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"
