# HTTP -> HTTPS redirect + ACME challenge
server {
    listen 80;
    listen [::]:80;
    server_name jonahsussman.net www.jonahsussman.net vpn.jonahsussman.net;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# non-www -> www redirect
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jonahsussman.net;

    ssl_certificate /etc/nginx/ssl/live/jonahsussman.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/jonahsussman.net/privkey.pem;

    location / {
        return 301 https://www.jonahsussman.net$request_uri;
    }
}

# Headscale VPN coordination server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vpn.jonahsussman.net;
    resolver 127.0.0.11 valid=30s;

    ssl_certificate /etc/nginx/ssl/live/jonahsussman.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/jonahsussman.net/privkey.pem;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    location /web/ {
        set $hsui http://headscale-ui:8080;
        proxy_pass $hsui;
    }

    location / {
        set $hs http://headscale:8080;
        proxy_pass $hs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http:// https://;
        proxy_buffering off;
    }
}

# Main HTTPS server
server {
    listen 443 default_server ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.jonahsussman.net;
    resolver 127.0.0.11 valid=30s;

    ssl_certificate /etc/nginx/ssl/live/jonahsussman.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/jonahsussman.net/privkey.pem;

    add_header Link '<https://www.jonahsussman.net$request_uri>; rel="canonical"' always;

    # Error handling via SSI
    error_page 400 401 403 404 500 502 503 504 /error.html;
    location = /error.html {
        ssi on;
        internal;
        root /usr/share/nginx/html;
    }

    # --- Projects ---
    location /projects/red-and-black-knights/ {
        set $rbk http://red-and-black-knights;
        rewrite ^/projects/red-and-black-knights/(.*) /$1 break;
        proxy_pass $rbk;
    }
    location /projects/software-renderer/ {
        set $sw http://software-renderer;
        rewrite ^/projects/software-renderer/(.*) /$1 break;
        proxy_pass $sw;
    }
    location /projects/scavenger/ {
        set $scav http://scavenger;
        rewrite ^/projects/scavenger/(.*) /$1 break;
        proxy_pass $scav;
    }
    location /projects/this-wiki-dne/ {
        set $wiki http://this-wiki-dne;
        rewrite ^/projects/this-wiki-dne/(.*) /$1 break;
        proxy_pass $wiki;
    }
    location /projects/name-a-woman/ {
        set $naw http://name-a-woman:8080;
        rewrite ^/projects/name-a-woman/(.*) /$1 break;
        proxy_pass $naw;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Trailing slash enforcement for project paths
    location ~ ^/projects/([^/]+)$ {
        return 301 /projects/$1/;
    }

    # Main site (catch-all)
    location / {
        set $main http://main-site;
        proxy_pass $main;
    }
}
