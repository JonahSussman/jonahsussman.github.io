# Dev config — no SSL, port 80 only
# Swapped in via docker-compose.dev.yaml

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=30s;

    error_page 400 401 403 404 500 502 503 504 /error.html;
    location = /error.html {
        ssi on;
        internal;
        root /usr/share/nginx/html;
    }

    location /projects/red-and-black-knights/ {
        set $rbk http://red-and-black-knights;
        rewrite ^/projects/red-and-black-knights/(.*) /$1 break;
        proxy_pass $rbk;
    }
    location /projects/software-renderer/ {
        set $sw http://software-renderer;
        rewrite ^/projects/software-renderer/(.*) /$1 break;
        proxy_pass $sw;
    }
    location /projects/scavanger/ {
        set $scav http://scavanger;
        rewrite ^/projects/scavanger/(.*) /$1 break;
        proxy_pass $scav;
    }

    location ~ ^/projects/([^/]+)$ {
        return 301 /projects/$1/;
    }

    location / {
        set $main http://main-site;
        proxy_pass $main;
    }
}
